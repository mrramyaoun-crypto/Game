name: MindGame native APK and screen checks
on:
  push:
    branches: [codex/mindgame-approved-game-screens]
    paths: ['MindGame/**', '.github/workflows/mindgame.yml']
  workflow_dispatch:
jobs:
  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create CI-only development signer
        run: |
          mkdir -p MindGame/development-signing
          keytool -genkeypair -keystore MindGame/development-signing/mindgame-test.jks -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Compile, exercise native controls and render screens
        working-directory: MindGame
        run: gradle --no-daemon -Pkotlin.incremental=false testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MindGame-native-review
          path: |
            MindGame/app/build/outputs/apk/debug/app-debug.apk
            MindGame/app/build/qa
            MindGame/app/build/reports
